    <meta name="theme-color" content="#101113" />
    <script>
      // Set the saved theme before first paint so the loader and app always agree.
      (() => {
        try {
          const savedTheme = localStorage.getItem('portfolio-theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'light' ? '#f7f3fa' : '#0e0c16',
          );
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

  <body>
    <noscript><style>#app-loader{display:none}</style>You need JavaScript enabled to view this portfolio.</noscript>
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="app-loader__visual" aria-hidden="true">
        <span class="app-loader__ring"></span>
        <span class="app-loader__ring app-loader__ring--inner"></span>
        <span class="app-loader__core">
          <svg class="app-loader__code" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="loader-code-gradient" x1="7" y1="8" x2="34" y2="31" gradientUnits="userSpaceOnUse">
                <stop stop-color="#f0b6ff" />
                <stop offset="0.52" stop-color="#d06ff4" />
                <stop offset="1" stop-color="#8b80f2" />
              </linearGradient>
            </defs>
            <path class="app-loader__brackets" d="M14 12.5 6.5 20l7.5 7.5M26 12.5l7.5 7.5-7.5 7.5" stroke="url(#loader-code-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path class="app-loader__slash" d="m23.5 8.5-7 23" stroke="#f5d7ff" stroke-width="2.5" stroke-linecap="round" />
            <circle class="app-loader__spark" cx="31.5" cy="8" r="1.6" fill="#bda5ff" />
          </svg>
        </span>
      </div>
      <p class="app-loader__message" hidden>This is taking longer than expected.</p>
      <button class="app-loader__retry" type="button" hidden>Reload page</button>
    </div>
    <div id="root"></div>
    <script>
      // Fail-safe: replace endless motion with a clear recovery action.
      window.setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (!loader || loader.classList.contains('app-loader--leaving')) return;
        loader.querySelector('.app-loader__message').hidden = false;
        const retry = loader.querySelector('.app-loader__retry');
        retry.hidden = false;
        retry.addEventListener('click', () => window.location.reload(), { once: true });
      }, 8000);
    </script>
  </body>
