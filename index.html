<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Alex Morgan, a product-minded software engineer creating thoughtful digital experiences." />
    <meta name="theme-color" content="#101113" />
    <script>
      // Set the saved theme before first paint so the loader and app always agree.
      (() => {
        try {
          const savedTheme = localStorage.getItem('portfolio-theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'light' ? '#f7f3fa' : '#0e0c16',
          );
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      /* Kept inline so the loading visual can render before the React bundle. */
      #app-loader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        color: #f8f5fb;
        background:
          radial-gradient(circle at 18% 22%, rgba(151, 65, 211, 0.22), transparent 27%),
          radial-gradient(circle at 82% 78%, rgba(83, 69, 196, 0.18), transparent 29%),
          #0e0c16;
        font-family: Manrope, system-ui, sans-serif;
        opacity: 0;
        overflow: hidden;
        animation: loader-reveal 350ms ease 160ms forwards;
      }

      #app-loader::before {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle at 15% 26%, rgba(255, 255, 255, 0.65) 0 1px, transparent 1.5px),
          radial-gradient(circle at 72% 18%, rgba(202, 137, 245, 0.55) 0 1px, transparent 1.5px),
          radial-gradient(circle at 84% 68%, rgba(255, 255, 255, 0.45) 0 1px, transparent 1.5px),
          radial-gradient(circle at 32% 82%, rgba(167, 127, 242, 0.5) 0 1px, transparent 1.5px);
        background-size: 230px 210px, 270px 250px, 190px 230px, 250px 270px;
        content: '';
        opacity: 0.52;
        animation: loader-stars 8s linear infinite;
      }

      .app-loader__visual {
        position: relative;
        width: 112px;
        height: 112px;
      }

      .app-loader__ring {
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(211, 138, 246, 0.32);
        border-top-color: #d27af5;
        border-radius: 50%;
        box-shadow: 0 0 28px rgba(170, 79, 220, 0.13);
        animation: loader-spin 2.2s linear infinite;
      }

      .app-loader__ring--inner {
        inset: 20px;
        border-color: rgba(124, 111, 231, 0.26);
        border-right-color: #8f7ae8;
        animation-direction: reverse;
        animation-duration: 1.65s;
      }

      .app-loader__core {
        position: absolute;
        inset: 27px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(223, 169, 250, 0.26);
        border-radius: 17px;
        color: #e3a0ff;
        background: linear-gradient(145deg, rgba(113, 48, 151, 0.78), rgba(56, 37, 106, 0.76));
        box-shadow: 0 14px 35px rgba(6, 3, 15, 0.32), inset 0 1px rgba(255, 255, 255, 0.11);
        overflow: hidden;
        animation: loader-core 1.8s ease-in-out infinite;
      }

      .app-loader__core::before {
        position: absolute;
        inset: 5px;
        border: 1px solid rgba(238, 200, 255, 0.09);
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 46%);
        content: '';
      }

      .app-loader__code {
        position: relative;
        z-index: 1;
        width: 42px;
        height: 42px;
        overflow: visible;
        filter: drop-shadow(0 0 7px rgba(214, 126, 251, 0.48));
      }

      .app-loader__brackets {
        stroke-dasharray: 34;
        animation: loader-code-draw 2.15s ease-in-out infinite;
      }

      .app-loader__slash {
        animation: loader-code-slash 1.7s ease-in-out infinite;
        transform-origin: center;
      }

      .app-loader__spark {
        animation: loader-code-spark 1.45s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .app-loader__message {
        position: relative;
        margin: 18px 0 0;
        color: #aaa3b1;
        font-size: 0.62rem;
        letter-spacing: 0.08em;
      }

      .app-loader__retry {
        position: relative;
        margin-top: 18px;
        padding: 8px 15px;
        color: inherit;
        border: 1px solid rgba(202, 123, 241, 0.38);
        border-radius: 999px;
        background: rgba(157, 71, 198, 0.13);
        font: 700 0.66rem/1 Manrope, system-ui, sans-serif;
        letter-spacing: 0.06em;
        cursor: pointer;
      }

      .app-loader__retry:hover,
      .app-loader__retry:focus-visible {
        border-color: #cf7af2;
        background: rgba(157, 71, 198, 0.24);
        outline: none;
      }

      #app-loader.app-loader--leaving {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        animation: none;
        transition: opacity 320ms ease, visibility 0s linear 320ms;
      }

      :root[data-theme='light'] #app-loader {
        color: #2d2133;
        background:
          radial-gradient(circle at 18% 22%, rgba(157, 75, 201, 0.16), transparent 29%),
          radial-gradient(circle at 82% 78%, rgba(91, 82, 204, 0.13), transparent 30%),
          #f7f3fa;
      }

      :root[data-theme='light'] .app-loader__core {
        color: #71338f;
        border-color: rgba(127, 59, 157, 0.2);
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.92), rgba(229, 214, 239, 0.94));
        box-shadow: 0 14px 35px rgba(72, 42, 85, 0.14), inset 0 1px #fff;
      }

      :root[data-theme='light'] .app-loader__message {
        color: #716777;
      }

      :root[data-theme='light'] .app-loader__retry {
        border-color: rgba(112, 50, 140, 0.24);
        background: rgba(143, 64, 179, 0.08);
      }

      @keyframes loader-reveal { to { opacity: 1; } }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      @keyframes loader-core { 50% { transform: scale(1.06) rotate(2deg); } }
      @keyframes loader-code-draw {
        0%, 12% { opacity: 0.35; stroke-dashoffset: 34; }
        45%, 78% { opacity: 1; stroke-dashoffset: 0; }
        100% { opacity: 0.35; stroke-dashoffset: -34; }
      }
      @keyframes loader-code-slash { 50% { opacity: 0.62; transform: translateX(1px); } }
      @keyframes loader-code-spark { 50% { opacity: 0.38; transform: scale(1.75); } }
      @keyframes loader-stars { 50% { transform: translate3d(8px, -6px, 0); } }

      @media (prefers-reduced-motion: reduce) {
        #app-loader { animation-duration: 1ms; }
        #app-loader.app-loader--leaving { transition-duration: 1ms; }
        #app-loader::before,
        .app-loader__ring,
        .app-loader__core,
        .app-loader__brackets,
        .app-loader__slash,
        .app-loader__spark { animation: none; }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.onload=null;this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>Alex Morgan — Software Engineer</title>
  </head>
  <body>
    <noscript><style>#app-loader { display: none; }</style>You need JavaScript enabled to view this portfolio.</noscript>
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="app-loader__visual" aria-hidden="true">
        <span class="app-loader__ring"></span>
        <span class="app-loader__ring app-loader__ring--inner"></span>
        <span class="app-loader__core">
          <svg class="app-loader__code" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="loader-code-gradient" x1="7" y1="8" x2="34" y2="31" gradientUnits="userSpaceOnUse">
                <stop stop-color="#f0b6ff" />
                <stop offset="0.52" stop-color="#d06ff4" />
                <stop offset="1" stop-color="#8b80f2" />
              </linearGradient>
            </defs>
            <path class="app-loader__brackets" d="M14 12.5 6.5 20l7.5 7.5M26 12.5l7.5 7.5-7.5 7.5" stroke="url(#loader-code-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path class="app-loader__slash" d="m23.5 8.5-7 23" stroke="#f5d7ff" stroke-width="2.5" stroke-linecap="round" />
            <circle class="app-loader__spark" cx="31.5" cy="8" r="1.6" fill="#bda5ff" />
          </svg>
        </span>
      </div>
      <p class="app-loader__message" hidden>This is taking longer than expected.</p>
      <button class="app-loader__retry" type="button" hidden>Reload page</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Fail-safe: replace endless motion with a clear recovery action.
      window.setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (!loader || loader.classList.contains('app-loader--leaving')) return;
        loader.querySelector('.app-loader__message').hidden = false;
        const retry = loader.querySelector('.app-loader__retry');
        retry.hidden = false;
        retry.addEventListener('click', () => window.location.reload(), { once: true });
      }, 8000);
    </script>
  </body>
</html>
